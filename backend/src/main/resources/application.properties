spring.application.name=banco-sangre-backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:BancoSangreDb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema ya existe (creado para la versión Node); Hibernate nunca lo autogenera ni lo altera.
# La evolución del esquema desde aquí en adelante se hace con Flyway (db/migration).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway: la BD actual del HLEV ya tiene el esquema baseline (V1) creado manualmente para
# la versión Node, así que se marca como ya aplicado y sólo se ejecutan migraciones nuevas (V2+).
# En una BD nueva (entorno de desarrollo/pruebas) V1 sí se ejecuta, creando el esquema completo.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=esquema heredado de la versión Node/JS
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS: el frontend Angular corre en su propio dev server (ng serve)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# RF-34: carpeta donde se guardan los respaldos lógicos automáticos de la base de datos.
app.backups.directorio=${BACKUPS_DIR:./backups}
