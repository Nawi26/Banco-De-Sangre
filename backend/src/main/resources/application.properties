spring.application.name=banco-sangre-backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:BancoSangreDb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema ya existe (creado para la versión Node); nunca se autogenera ni se altera.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS: el frontend Angular corre en su propio dev server (ng serve)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
