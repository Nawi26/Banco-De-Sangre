<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo=${info.titulo()})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section>
        <div class="two-col">
          <div class="card">
            <div class="card-title-row"><div><div class="card-title">Generación de la etiqueta</div>
            <div class="card-desc">Datos que se imprimen en la etiqueta de la unidad</div></div></div>
            <div class="grid-2" style="margin-bottom:14px;">
              <div class="field"><label>Código de la donación (DIN)</label><input class="input mono" id="et-din" value="=W1237250171238" readonly></div>
              <div class="field"><label>Código del componente</label><input class="input mono" id="et-code" value="E0387V00" readonly></div>
              <div class="field"><label>Grupo ABO/Rh</label>
                <select class="input mono" id="et-abo" onchange="updateEtiquetaPreview()">
                  <option>O NEG</option><option>O POS</option><option>A NEG</option><option>A POS</option>
                  <option>B NEG</option><option>B POS</option><option>AB NEG</option><option>AB POS</option>
                </select>
              </div>
              <div class="field"><label>Fecha / hora de colecta</label><input class="input mono" id="et-colecta" value="12/09/2026 08:14" readonly></div>
              <div class="field"><label>Fecha de vencimiento</label><input class="input mono" id="et-vence" value="11/10/2026" readonly></div>
              <div class="field"><label>Hemocomponente</label>
                <select class="input mono" id="et-producto" onchange="updateEtiquetaPreview()">
                  <option value="E0387V00|Concentrado de Hematíes">Concentrado de Hematíes</option>
                  <option value="E0217V00|Plasma Fresco Congelado">Plasma Fresco Congelado</option>
                  <option value="E0453V00|Concentrado de Plaquetas">Concentrado de Plaquetas</option>
                  <option value="E0301V00|Crioprecipitado">Crioprecipitado</option>
                </select>
              </div>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button class="btn btn-primary btn-sm" onclick="generarNuevoDIN()">Generar nuevo DIN</button>
              <button class="btn btn-ghost btn-sm" onclick="imprimirEtiqueta()">Imprimir etiqueta</button>
              <button class="btn btn-ghost btn-sm" onclick="leerCodigo()">Leer código (escáner)</button>
              <button class="btn btn-ghost btn-sm" onclick="generarCertificado()">Certificado de calidad (QR)</button>
            </div>
          </div>

          <div class="card" style="display:flex; flex-direction:column; align-items:center; gap:14px; justify-content:center;">
            <div style="font-size:12px; color:var(--ink-600); font-weight:600;">VISTA PREVIA DE ETIQUETA</div>
            <div style="width:100%; max-width:280px; border:1.5px solid var(--ink-900); border-radius:4px; padding:14px; font-family:var(--font-mono);" id="label-preview">
              <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700; border-bottom:1px solid var(--ink-900); padding-bottom:6px; margin-bottom:6px;">
                <span>HLEV · BANCO DE SANGRE</span><span>ISBT 128</span>
              </div>
              <div style="height:34px; background:repeating-linear-gradient(90deg,#12161F 0 2px, transparent 2px 4px, #12161F 4px 6px, transparent 6px 9px); margin-bottom:6px;"></div>
              <div style="font-size:11px; letter-spacing:.03em; margin-bottom:8px;" id="label-din-text">=W1237250171238</div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:10.5px;">
                <div><div style="color:var(--ink-400);">PRODUCTO</div><div style="font-weight:700;" id="label-code">E0387V00</div></div>
                <div><div style="color:var(--ink-400);">GRUPO</div><div style="font-weight:700; color:var(--red-700);" id="label-abo">O NEG</div></div>
                <div><div style="color:var(--ink-400);">COLECTA</div><div style="font-weight:700;" id="label-colecta">12/09/26</div></div>
                <div><div style="color:var(--ink-400);">VENCE</div><div style="font-weight:700;" id="label-vence">11/10/26</div></div>
              </div>
              <div style="margin-top:10px; height:22px; background:repeating-linear-gradient(90deg,#12161F 0 1px, transparent 1px 3px);"></div>
            </div>
          </div>
        </div>
  </section>
</div>

  <script th:inline="none">
    document.addEventListener('DOMContentLoaded', function() {
      updateEtiquetaPreview();
    });
  </script>
</body>
</html>
