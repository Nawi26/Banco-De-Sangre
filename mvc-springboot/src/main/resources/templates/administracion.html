<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo=${info.titulo()})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">

        <div data-tabpanel="admin:usuarios" class="card">

            <button class="btn btn-primary btn-sm" onclick="abrirModalUsuario()">+ Nuevo usuario</button>
          </div>
          </div>
          <table>
            <thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Último acceso</th><th>Estado</th><th></th></tr></thead>
            <tbody id="usuarios-rows"></tbody>
          </table>
        </div>

  </section>
</div>

  <script th:inline="javascript">
    state.usuarios = /*[[${usuarios}]]*/ [];
    sincronizarLocal('usuarios');
    document.addEventListener('DOMContentLoaded', function() {
      renderUsuarios();
    });
  </script>
</body>
</html>
