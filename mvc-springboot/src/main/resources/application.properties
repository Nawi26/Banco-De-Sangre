spring.application.name=bancosangre-mvc
server.port=8080

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# HLEV - Banco de Sangre Tipo II (simulacion)
app.institucion=Hospital de Lima Este Vitarte

# Base de datos PostgreSQL (se pueden cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bancosangre}
spring.datasource.username=${DB_USER:bancosangre}
spring.datasource.password=${DB_PASSWORD:bancosangre}

# La base se crea aparte (crear_base.sql + bancosangre_bd.sql). true = que Spring ejecute los scripts al arrancar
app.db.inicializar=${DB_INICIALIZAR:false}

# Configuración local (tu usuario y clave de PostgreSQL). Este archivo NO se sube a GitHub.
spring.config.import=optional:classpath:application-local.properties
